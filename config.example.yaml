# 复制本文件为 config.yaml 后填写真实值（config.yaml 已被 .gitignore 忽略）
server:
  host: "0.0.0.0"
  port: 8001

# Optional hardening: set this in the server environment, not in config.yaml:
# KELSEY_ADMIN_TOKEN="change-me-long-random"
# When set, /api, /mcp, and /mcp-http require X-Kelsey-Admin-Token
# or Authorization: Bearer <token>.
#
# API keys are intentionally not stored in the database or edited from the Web UI.
# Set only the keys you use as server environment variables:
# KELSEY_LLM_API_KEY="..."
# KELSEY_ENV_LLM_API_KEY="..."
# KELSEY_SNAPSHOT_LLM_API_KEY="..."
# KELSEY_VECTOR_EMBEDDING_API_KEY="..."
# KELSEY_PLAN_WEB_SEARCH_API_KEY="..."

llm:
  api_base: "https://your-api-provider.com/v1"
  api_key: ""  # Use KELSEY_LLM_API_KEY in the server environment.
  model: "your-model-name"

database:
  path: "./data/kelsey.db"

environment:
  min_time_unit_hours: 24
  generator: "template"

character:
  # system_prompt_file: "./character_prompt.txt"
  # system_prompt: "你是凯尔希..."

memory_store:
  type: "vector"
  max_snapshots: 7

ob:
  enabled: true
  buckets_dir: "./data/ob_buckets"
  decay:
    lambda: 0.05
    threshold: 0.3
    check_interval_hours: 24
    emotion_weights:
      base: 1.0
      arousal_boost: 0.8

wechat:
  enabled: true
  # openclaw_state_dir: "C:/Users/yourname/.openclaw"
  sync_state_path: "./data/wechat_sync_state.json"
  session_state_path: "./data/wechat_sessions.json"
  max_history_turns: 8

# 自主生活系统中的网络搜索（如 Tavily）不走 config.yaml，
# 而是通过运行时设置 / system_settings 配置：
# - plan_web_search_enabled
# - plan_web_search_api_base
# - plan_web_search_api_key
# 推荐 Tavily:
# - api_base: "https://api.tavily.com/search"
