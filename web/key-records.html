<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/static/favicon.jpg?v=950ceae3">
  <link rel="apple-touch-icon" href="/static/favicon.jpg?v=950ceae3">
  <title>凯尔希状态机 - 关键记录</title>
  <link rel="stylesheet" href="/static/style.css?v=20260603-spacer72">
</head>
<body>
  <nav>
    <span class="logo">Kal'tsit State Machine</span>
    <a href="/">仪表盘</a>
    <a href="/guide">使用指南</a>
    <a href="/snapshots-history">状态历史</a>
    <a href="/events-history">事件历史</a>
    <a href="/key-records" class="active">关键记录</a>
    <a href="/world-books">&#19990;&#30028;&#20070;</a>
    <a href="/schedule">&#26085;&#31243;&#34920;</a>
    <a href="/npcs">NPC &#31649;&#29702;</a>
    <a href="/settings">设定管理</a>
    <a href="/environment-manage">环境管理</a>
    <a href="/evolution">人格演化</a>
    <a href="/ob">OB &#35760;&#24518;</a>
    <a href="/vectors">向量管理</a>
    <a href="/admin/health">系统健康</a>
  </nav>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="key-record-search-input" placeholder="搜索标题 / 内容 / 标签..." onkeydown="if(event.key==='Enter')searchKeyRecords()">
      <select id="key-record-type-filter" style="max-width:180px;" onchange="loadKeyRecords()">
        <option value="">全部类型</option>
        <option value="medication_protocol">用药方案</option>
        <option value="health_monitoring">健康监测</option>
        <option value="dietary_intervention">食疗干预</option>
        <option value="anniversary_date">纪念日</option>
        <option value="medical_review_date">复诊日期</option>
        <option value="lifecycle_milestone">人生节点</option>
        <option value="key_collaboration">关键协作</option>
        <option value="commitment_agreement">承诺协议</option>
        <option value="emotional_anchor">情感锚点</option>
        <option value="life_pattern">生活模式</option>
      </select>
      <select id="key-record-life-scope-filter" style="max-width:150px;" onchange="loadKeyRecords()">
        <option value="">全部生活线</option>
        <option value="user_life">用户侧</option>
        <option value="character_life">角色侧</option>
        <option value="shared_life">共享线</option>
      </select>
      <button class="btn btn-primary" onclick="searchKeyRecords()">搜索</button>
      <button class="btn" onclick="openAddKeyRecordModal()">添加记录</button>
      <button class="btn" onclick="batchVectorizeKeyRecords()">批量向量化</button>
      <button class="btn" onclick="openKeyRecordRelabelModal()">迁移/重标</button>
      <button class="btn" onclick="document.getElementById('key-record-json-import-input')?.click()">&#25209;&#37327;&#23548;&#20837; JSON</button>
      <input type="file" id="key-record-json-import-input" accept=".json,application/json" style="display:none" aria-hidden="true" onchange="importKeyRecordsJson(this)">
      <button class="btn" onclick="toggleSelectAllVisibleKeyRecords()">&#20840;&#36873;/&#21462;&#28040;&#20840;&#36873;</button>
      <button class="btn" onclick="clearKeyRecordSelection()">&#28165;&#31354;&#36873;&#25321;</button>
      <button class="btn btn-danger" onclick="batchDeleteKeyRecords()">&#21024;&#38500;&#36873;&#20013;</button>
      <span class="list-meta" id="key-record-bulk-status">&#24050;&#36873;&#25321; 0 &#26465;</span>
      <label class="checkbox-label">
        <input type="checkbox" id="key-record-include-archived" onchange="loadKeyRecords()">
        显示归档
      </label>
      <select id="key-record-export-format" style="max-width:100px;">
        <option value="md">MD</option>
        <option value="json">JSON</option>
      </select>
      <button class="btn btn-primary" onclick="exportKeyRecords()">导出当前列表</button>
    </div>

    <div class="card" style="padding:0">
      <div id="key-record-list"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">就绪</div>
  <script src="/static/app.js?v=20260513-key-record-import"></script>
  <script>initKeyRecordsPage();</script>
</body>
</html>
