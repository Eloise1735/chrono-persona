<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/static/favicon.jpg?v=950ceae3">
  <link rel="apple-touch-icon" href="/static/favicon.jpg?v=950ceae3">
  <title>凯尔希状态机 - 世界书</title>
  <link rel="stylesheet" href="/static/style.css?v=20260603-statusbar">
</head>
<body>
  <nav>
    <span class="logo">Kal'tsit State Machine</span>
    <a href="/">仪表盘</a>
    <a href="/guide">使用指南</a>
    <a href="/snapshots-history">状态历史</a>
    <a href="/events-history">事件历史</a>
    <a href="/key-records">关键记录</a>
    <a href="/world-books" class="active">世界书</a>
    <a href="/schedule">日程表</a>
    <a href="/npcs">NPC 管理</a>
    <a href="/settings">设定管理</a>
    <a href="/environment-manage">环境管理</a>
    <a href="/evolution">人格演化</a>
    <a href="/ob">OB 记忆</a>
    <a href="/vectors">向量管理</a>
    <a href="/admin/health">系统健康</a>
  </nav>

  <div class="container">
    <div class="card">
      <h2>世界书管理</h2>
      <p class="list-meta">
        世界书用于稳定属性、偏好、身体/profile 基线和设定背景。它不会进入对话开头注入，也不会参与后台环境生成；需要时请通过 recall_world_book 或本页搜索主动召回。
      </p>
      <div class="btn-group" style="flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px">
        <input type="text" id="world-book-search-input" placeholder="搜索稳定属性 / 偏好 / 档案..." onkeydown="if(event.key==='Enter')searchWorldBooks()">
        <label class="checkbox-label" style="margin:0">
          <input type="checkbox" id="world-book-include-inactive">
          包含停用
        </label>
        <button class="btn btn-primary" onclick="searchWorldBooks()">搜索</button>
        <button class="btn" onclick="loadWorldBooks()">显示全部</button>
        <button class="btn btn-primary" onclick="openCreateWorldBookModal()">新增条目</button>
        <button type="button" class="btn" onclick="document.getElementById('world-book-json-import-input')?.click()">批量导入 JSON</button>
        <input type="file" id="world-book-json-import-input" accept=".json,application/json" style="display:none" aria-hidden="true">
        <label class="checkbox-label" style="margin:0">
          <input type="checkbox" id="world-book-import-skip-disabled" checked>
          跳过酒馆禁用条目
        </label>
        <button class="btn" onclick="autoFillWorldBookMeta()">自动补标题/关键词</button>
        <button class="btn" onclick="syncWorldBookVectors()">向量化全部启用条目</button>
      </div>
      <div class="list-meta" style="margin-top:8px">
        删除入口已从常规管理中移除；不再使用的稳定资料请停用，以便保留历史来源。
      </div>
    </div>

    <div class="card" style="padding:0">
      <div id="world-book-list"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">就绪</div>
  <script src="/static/app.js?v=20260512-world-books"></script>
  <script>initWorldBooksPage();</script>
</body>
</html>
