<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/static/favicon.jpg?v=950ceae3">
  <link rel="apple-touch-icon" href="/static/favicon.jpg?v=950ceae3">
  <title>凯尔希状态机 - 环境管理</title>
  <link rel="stylesheet" href="/static/style.css?v=20260603-navfix">
</head>
<body>
  <nav>
    <span class="logo">Kal'tsit State Machine</span>
    <a href="/">仪表盘</a>
    <a href="/guide">使用指南</a>
    <a href="/snapshots-history">状态历史</a>
    <a href="/events-history">事件历史</a>
    <a href="/key-records">关键记录</a>
    <a href="/world-books">世界书</a>
    <a href="/schedule">日程表</a>
    <a href="/npcs">NPC 管理</a>
    <a href="/settings">设定管理</a>
    <a href="/environment-manage" class="active">环境管理</a>
    <a href="/evolution">人格演化</a>
    <a href="/ob">OB 记忆</a>
    <a href="/vectors">向量管理</a>
    <a href="/admin/health">系统健康</a>
  </nav>

  <div class="container">
    <div class="tabs" id="environment-manage-tabs">
      <div class="tab active" data-tab="history" onclick="switchEnvironmentManageTab('history')">环境历史</div>
      <a class="tab" href="/world-books">世界书管理</a>
    </div>

    <div id="environment-manage-tab-history">
      <div class="card">
        <div class="btn-group" style="flex-wrap:wrap;align-items:center;gap:8px">
          <button class="btn" onclick="loadEnvironmentHistory()">刷新</button>
          <label class="checkbox-label" style="margin:0">
            <input type="checkbox" id="environment-include-empty" onchange="loadEnvironmentHistory()">
            显示空环境
          </label>
          <button class="btn" id="environment-history-toggle-manage-btn" onclick="toggleEnvironmentHistoryManageMode()">开启选择管理</button>
          <button class="btn" onclick="selectAllEnvironmentHistory()">全选</button>
          <button class="btn" onclick="clearEnvironmentHistorySelection()">清空选择</button>
          <button class="btn btn-danger" onclick="deleteSelectedEnvironmentHistory()">删除勾选快照</button>
        </div>
        <div class="list-meta" id="environment-history-selection-summary" style="margin-top:8px;">管理模式未开启</div>
        <div class="list-meta" style="margin-top:6px;">说明：列表对应数据库中的状态快照；删除后该条快照及其中的环境 JSON 一并移除，与「状态历史」页删除为同一操作。</div>
      </div>
      <div class="card" style="padding:0">
        <div id="environment-history-list"><div class="loading">加载中...</div></div>
      </div>
    </div>

    <div class="card">
      <div class="list-meta">模型调用相关配置已迁移到「设定管理 -> 模型调用」子页面，环境管理页不再重复提供配置入口。</div>
      <div class="btn-group" style="margin-top:10px;">
        <a class="btn" href="/settings">前往设定管理</a>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">就绪</div>
  <script src="/static/app.js?v=20260327"></script>
  <script>initEnvironmentManagePage();</script>
</body>
</html>
